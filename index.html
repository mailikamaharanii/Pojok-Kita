<style>
:root{--bg:#fff5f8;--card:#ffffff;--text:#4a2c3a;--muted:#9a7384;--accent:#ff6b9d;--accent2:#ffd6e5;--line:#f5d5e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1218;--card:#2c1a24;--text:#ffe8f0;--muted:#c79bb0;--accent:#ff7fae;--accent2:#4a2535;--line:#4a2d3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1218;--card:#2c1a24;--text:#ffe8f0;--muted:#c79bb0;--accent:#ff7fae;--accent2:#4a2535;--line:#4a2d3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.counter{background:var(--accent2);border-radius:18px;padding:14px;text-align:center;margin-bottom:18px;font-weight:700}
.counter b{font-size:1.6rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--text);transition:transform .15s}
.tile:active{transform:scale(.96)}
.grid .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile .e{font-size:2rem;display:block}
.tile span.t{font-weight:800;display:block;margin-top:4px}
.tile small{color:var(--muted)}
.back{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer}
.btn:active{transform:scale(.96)}
.center{text-align:center}
.gift{font-size:5rem;display:inline-block;cursor:pointer}
.shake{animation:sh .6s}
@keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
.prize{font-size:1.2rem;font-weight:800;color:var(--accent);min-height:3rem;margin-top:10px}
.tl{border-left:3px solid var(--accent);margin-left:8px;padding-left:16px}
.tl .item{margin-bottom:18px;position:relative}
.tl .item::before{content:"";position:absolute;left:-23px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.date{font-size:.8rem;color:var(--muted);font-weight:700}
.letter{width:100%;text-align:left;background:var(--card);border:2px dashed var(--accent);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;color:var(--text);cursor:pointer}
.letter.open{border-style:solid;background:var(--accent2)}
.letter .body{margin-top:8px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit;color:var(--text);cursor:pointer}
.opt.ok{background:#c9f2d5;border-color:#4caf6d;color:#1b4a2a}
.opt.no{background:#ffd0d0;border-color:#e05555;color:#5a1a1a}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;width:100%;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.row input{margin:0}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.todo .tx{flex:1}
.x{background:none;border:none;font-size:1.1rem;cursor:pointer}
.big{font-size:1.15rem;line-height:1.6;font-weight:700}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;margin:0 4px 6px 0;font:inherit;font-weight:700;color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tutup{font-weight:800;color:var(--accent);padding:4px 10px;border:2px solid var(--accent);border-radius:999px;font-size:.8rem;white-space:nowrap}
.duel{display:flex;flex-direction:column;gap:8px;min-height:68vh}
.pad{flex:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;text-align:center;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:12px}
.p0{background:#ff6b9d;transform:rotate(180deg)}
.p1{background:#5b8cff}
.mid{text-align:center;font-weight:800;font-size:1.2rem;min-height:2rem}
.sb{font-size:2.2rem;background:#fff;border:none;border-radius:14px;padding:8px 14px;margin:0 4px;cursor:pointer}
.hidden{display:none}
#inv{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:50;max-width:536px;margin:0 auto;background:var(--accent);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center;justify-content:space-between}
#inv.hidden{display:none}
#inv button{font:inherit;font-weight:800;border:none;border-radius:999px;padding:8px 14px;cursor:pointer}
</style>
</head>

function duelHTML(){return backG()+'<div class="duel"><div class="pad p0" id="pd0"><div id="pt0"></div></div><div class="mid" id="mid"></div><div class="pad p1" id="pd1"><div id="pt1"></div></div></div>'}
function bindPads(){[0,1].forEach(function(i){el('pd'+i).onpointerdown=function(ev){ev.preventDefault();padTap(i)}})}

function tapStart(){
  stopDz();var my=dz={m:'tap',n:[0,0],on:false},G=CONFIG.pemain,c=3;
  app.innerHTML=duelHTML();bindPads();setT(0,G[0]);setT(1,G[1]);
  (function tick(){
    if(dz!==my||!midT(c>0?String(c):'GO!'))return;
    if(c>0){c--;setTimeout(tick,700);return}
    my.on=true;my.t0=Date.now();setT(0,'0');setT(1,'0');
    my.iv=setInterval(function(){
      if(dz!==my||!el('mid')){clearInterval(my.iv);return}
      var r=10-(Date.now()-my.t0)/1000;
      if(r<=0){clearInterval(my.iv);my.on=false;var n=my.n;duelEnd(n[0]>n[1]?0:n[1]>n[0]?1:-1)}
      else midT('⏱ '+r.toFixed(1))
    },100);
  })();
}
function reakStart(){stopDz();dz={m:'reak',w:[0,0],r:0,on:false,go:false};reakRound()}
function reakRound(){
  var G=CONFIG.pemain,my=dz;app.innerHTML=duelHTML();bindPads();
  setT(0,G[0]+': tunggu hijau 🚦');setT(1,G[1]+': tunggu hijau 🚦');
  midT('Ronde '+(my.r+1)+'  •  '+G[0]+' '+my.w[0]+' - '+my.w[1]+' '+G[1]);
  my.on=true;my.go=false;
  my.to=setTimeout(function(){
    if(dz!==my||!el('pd0'))return;
    my.go=true;my.t=Date.now();
    [0,1].forEach(function(i){el('pd'+i).style.background='#3ecf6e';setT(i,'TAP! 👆')});
  },2000+Math.random()*3000);
}
function padTap(i){
  if(dz.m==='tap'){if(dz.on){dz.n[i]++;setT(i,String(dz.n[i]))}}
  else if(dz.m==='reak'&&dz.on){
    var my=dz,G=CONFIG.pemain,w=my.go?i:1-i;
    my.on=false;clearTimeout(my.to);my.w[w]++;
    midT(my.go?G[i]+' paling cepat! ('+(Date.now()-my.t)+' ms)':G[i]+' kecepetan, foul! 😆');
    setTimeout(function(){if(dz!==my||!el('mid'))return;if(my.w[w]>=2)duelEnd(w);else{my.r++;reakRound()}},1400);
  }
}

function suitPick(i,k){
  if(dz.m!=='suit'||dz.c[i]!==null)return;
  var my=dz,G=CONFIG.pemain;my.c[i]=k;el('pd'+i).textContent='Sudah memilih ✅';
  if(my.c[0]===null||my.c[1]===null)return;
  var a=my.c[0],b=my.c[1],w=a===b?-1:((a-b+3)%3===1?0:1);
  if(w>=0)my.w[w]++;
  midT(SE[a]+' lawan '+SE[b]+'  '+(w<0?'Seri, ulang!':G[w]+' menang ronde ini!'));
  setTimeout(function(){if(dz!==my||!el('mid'))return;if(w>=0&&my.w[w]>=2)duelEnd(w);else suitRound()},1800);
}

var ROOM='',ME=-1,FB=null,OFF=0,ONL=false,GD={},OG=null,lastSid=0,M2=true,CURV=null,CURM='gameView',pickedMe=-1;
try{ROOM=localStorage.getItem('pk_room')||'';var _m=parseInt(localStorage.getItem('pk_me'),10);ME=isNaN(_m)?-1:_m;pickedMe=ME}catch(e){}
var SYNC={core:1,visited:1,papan:1,skor:1,misiNow:1,bestK:1};
var GNAME={tap:'Tap Race',reak:'Reaksi',suit:'Suit Berdua',angka:'Tebak Angka',pilih:'Tebak Pilihan'};

function now(){return Date.now()+OFF}
function ref(p){return FB.ref('pojokkita/'+ROOM+'/'+p)}
function onlineReady(){return !!FB&&ME>=0}

function stText(){
  if(!CONFIG.firebaseUrl)return '⚪ 2 HP belum diaktifkan';

  if(typeof firebase==='undefined')return '🔴 Gagal memuat Firebase (cek internet)';
  return (ONL?'🟢 Tersambung':'🟡 Menyambungkan…')+' sebagai '+CONFIG.pemain[ME];
}
function paintStatus(){var e=el('st');if(e)e.textContent=stText();var c=el('cst');if(c)c.textContent=stText()}
function isTyping(){var a=document.activeElement;return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&a.type!=='checkbox'))}
function refreshView(){if(CURV&&!OG&&!isTyping())window[CURV]()}

function connect(){
  if(FB||!ROOM||ME<0||!CONFIG.firebaseUrl||typeof firebase==='undefined')return;
  try{
    if(!firebase.apps.length)firebase.initializeApp({databaseURL:CONFIG.firebaseUrl});
    FB=firebase.database();
  }catch(e){FB=null;return}
  FB.ref('.info/serverTimeOffset').on('value',function(s){OFF=s.val()||0});
  FB.ref('.info/connected').on('value',function(s){ONL=!!s.val();paintStatus()});
  ref('d').on('value',onData);
  ref('g').on('value',function(s){GD=s.val()||{};gUpdate()});
}
function mergeV(k,l,r){
  if(l==null)return r;
  if(Array.isArray(r)&&Array.isArray(l)){var seen={},out=[];r.concat(l).forEach(function(x){var s=JSON.stringify(x);if(!seen[s]){seen[s]=1;out.push(x)}});return out}
  if(k==='skor')return {w:[Math.max((l.w||[0,0])[0],(r.w||[0,0])[0]),Math.max((l.w||[0,0])[1],(r.w||[0,0])[1])],xp:Math.max(l.xp||0,r.xp||0),done:Math.max(l.done||0,r.done||0)};
  if(k==='bestK')return Math.max(l,r);
  return r;
}
function onData(snap){
  var d=snap.val()||{},merged=false,chg=false;
  try{merged=!!localStorage.getItem('pk_merged')}catch(e){}
  Object.keys(SYNC).forEach(function(k){
    var rs=d[k],lv=ls(k,null);
    if(rs==null){if(lv!=null)sv(k,lv);return}
    var rv;try{rv=JSON.parse(rs)}catch(e){return}
    if(!merged){
      var ms=JSON.stringify(mergeV(k,lv,rv));
      try{localStorage.setItem(k,ms)}catch(e){}
      if(ms!==rs)ref('d/'+k).set(ms);
      chg=true;
    }else if(localStorage.getItem(k)!==rs){
      try{localStorage.setItem(k,rs)}catch(e){}
      chg=true;
    }
  });
  if(!merged){try{localStorage.setItem('pk_merged','1')}catch(e){}}
  if(chg)refreshView();
}

function gS(){return (GD.s&&OG&&GD.s[OG.sid])||{}}

function gW(path,val){if(OG&&FB)ref('g/s/'+OG.sid+'/p'+ME+'/'+path).set(val)}
function bothReady(){return !!(gP(0).r&&gP(1).r)}
function T0(){return Math.max(gP(0).r,gP(1).r)+3500}
function bk(){return '<button class="back" onclick="gameView()">← Menu game</button>'}
function scr(key,html,after){

/* Tap Race */
function rTap(){
  if(!bothReady()){lobby();return}
  var n=now(),t0=T0(),op=1-ME,P=CONFIG.pemain;
  if(n>=t0+10000){
    if(!OG.fin){OG.fin=true;gW('n',OG.cnt);gW('f',1)}
    if((gP(0).f&&gP(1).f)||n>=t0+13000){var a=gP(0).n||0,b=gP(1).n||0;gEnd(a>b?0:b>a?1:-1,'<p class="sub">'+a+' lawan '+b+' ketukan</p>');return}
  }
  scr('tap',bk()+'<div class="duel"><div class="mid" id="mid"></div><div class="pad" id="pad" style="background:'+(ME?'#5b8cff':'#ff6b9d')+'"><div id="pt"></div></div><div class="mid" id="opp"></div></div>',function(){el('pad').onpointerdown=function(ev){ev.preventDefault();tapHit()}});
  el('pt').textContent=n<t0?P[ME]:String(OG.cnt);
  el('mid').textContent=n<t0?String(Math.min(3,Math.ceil((t0-n)/1000))):n<t0+10000?'⏱ '+((t0+10000-n)/1000).toFixed(1):'Menghitung…';
  el('opp').textContent=(n>=t0&&n<t0+10000)?P[op]+': '+(gP(op).n||0):'';
}
function tapHit(){
  if(!OG||OG.m!=='tap'||OG.over||!bothReady())return;
  var n=now(),t0=T0();
  if(n>=t0&&n<t0+10000){OG.cnt++;el('pt').textContent=OG.cnt;gW('n',OG.cnt)}
}

/* Reaksi */
function reakCalc(n){
  var t0=T0(),D=OG.c.d.split(',').map(Number),w=[0,0],info=[],r=0;
  for(;r<5;r++){
    var S=t0+r*7000,go=S+D[r],a=gP(0)['t'+r],b=gP(1)['t'+r];
    var fa=a!==undefined&&a<go,fb=b!==undefined&&b<go;
    var fin=(a!==undefined&&b!==undefined)||fa||fb||n>=S+6500;
    if(!fin)break;
    var va=(a!==undefined&&!fa)?a:null,vb=(b!==undefined&&!fb)?b:null,x;
    if(fa&&fb)x=-1;else if(fa)x=1;else if(fb)x=0;
    else if(va!==null&&vb!==null)x=va<vb?0:vb<va?1:-1;
    else if(va!==null)x=0;else if(vb!==null)x=1;else x=-1;
    info.push({x:x,ms:x===0?va-go:x===1?vb-go:0,foul:fa||fb});
    if(x>=0)w[x]++;
    if(w[0]>=2||w[1]>=2){r++;break}
  }
  return {t0:t0,D:D,w:w,info:info,r:r,over:w[0]>=2||w[1]>=2||r>=5};
}
function rReak(){
  if(!bothReady()){lobby();return}
  var n=now(),P=CONFIG.pemain,c=reakCalc(n);
  if(c.over){var w=c.w[0]>c.w[1]?0:c.w[1]>c.w[0]?1:-1;gEnd(w,'<p class="sub">Skor '+c.w[0]+' - '+c.w[1]+'</p>');return}
  scr('reak',bk()+'<div class="duel"><div class="mid" id="mid"></div><div class="pad" id="pad" style="background:#9a7384"><div id="pt"></div></div><div class="mid" id="opp"></div></div>',function(){el('pad').onpointerdown=function(ev){ev.preventDefault();reakHit()}});
  var r=c.r,S=c.t0+r*7000,go=S+c.D[r],mine=OG['t'+r]!==undefined||gP(ME)['t'+r]!==undefined,pad=el('pad'),txt,col;
  if(n<c.t0){txt=String(Math.min(3,Math.ceil((c.t0-n)/1000)));col='#9a7384'}
  else if(n<S){txt='Siap-siap…';col='#9a7384'}
  else if(mine){txt='Menunggu '+P[1-ME]+'…';col='#9a7384'}
  else if(n<go){txt='Tunggu hijau 🚦';col='#e05555'}
  else{txt='TAP! 👆';col='#3ecf6e'}
  pad.style.background=col;
  el('pt').textContent=txt;
  el('mid').textContent='Ronde '+(r+1)+'  •  '+P[0]+' '+c.w[0]+' - '+c.w[1]+' '+P[1];
  var li=c.info[r-1];
  el('opp').textContent=li?(li.x<0?'Ronde tadi: seri':'Ronde tadi: '+P[li.x]+' menang'+(li.foul?' (lawan foul 😆)':' ('+li.ms+' ms)')):'';
}
function reakHit(){
  if(!OG||OG.m!=='reak'||OG.over||!bothReady())return;
  var n=now(),c=reakCalc(n),r=c.r;
  if(c.over||n<c.t0+r*7000)return;
  if(OG['t'+r]!==undefined||gP(ME)['t'+r]!==undefined)return;
  OG['t'+r]=n;gW('t'+r,n);OG.render();
}

/* Suit */
function rSuit(){
  if(!bothReady()){lobby();return}
  var P=CONFIG.pemain,w=[0,0],r=0,last='';
  while(true){
    var a=gP(0)['c'+r],b=gP(1)['c'+r];
    if(a===undefined||b===undefined)break;
    var x=a===b?-1:((a-b+3)%3===1?0:1);
    if(x>=0)w[x]++;
    last=SE[a]+' lawan '+SE[b]+': '+(x<0?'Seri, ulang!':P[x]+' menang ronde ini!');
    r++;
    if(w[0]>=2||w[1]>=2)break;
  }
  if(w[0]>=2||w[1]>=2){gEnd(w[0]>=2?0:1,'<p class="sub">'+esc(last)+'</p>');return}
  var mine=gP(ME)['c'+r],h='<div class="mid center">'+esc(P[0])+' '+w[0]+' - '+w[1]+' '+esc(P[1])+'</div>'+(last?'<p class="sub">Ronde tadi: '+esc(last)+'</p>':'');
  if(mine===undefined)scr('s'+r+'p',bk()+h+'<div class="card center"><b>'+esc(P[ME])+', pilih!</b><div style="margin-top:10px">'+SE.map(function(e,k){return '<button class="sb" onclick="sPick('+r+','+k+')">'+e+'</button>'}).join('')+'</div></div>');
  else scr('s'+r+'w',bk()+h+'<div class="card center"><h2>Sudah memilih ✅</h2><p class="sub">Menunggu '+esc(P[1-ME])+'…</p></div>');
}
function sPick(r,k){if(OG&&OG.m==='suit'&&gP(ME)['c'+r]===undefined)gW('c'+r,k)}

/* Tebak Angka */
function rAngka(){
  if(!bothReady()){lobby();return}
  var P=CONFIG.pemain,s=OG.c.s,lo=1,hi=100,k=0,msg='';
  while(true){
    var who=k%2,g=gP(who)['g'+k];
    if(g===undefined)break;
    if(g===s){gEnd(who,'<p class="sub">Angkanya '+s+', ditebak dalam '+(k+1)+' kali</p>');return}
    if(g<s)lo=Math.max(lo,g+1);else hi=Math.min(hi,g-1);
    msg=P[who]+' menebak '+g+': '+(g<s?'terlalu kecil':'terlalu besar');
    k++;
  }
  var my=(k%2===ME);
  scr('a'+k+(my?'y':'n'),bk()+'<h2>Tebak Angka 🔢</h2><p class="sub">Angka rahasia ada di antara '+lo+' dan '+hi+'. Yang menebak tepat menang!</p><div class="card center">'+(msg?'<p>'+esc(msg)+'</p>':'')+(my?'<p>Giliran kamu, <b>'+esc(P[ME])+'</b></p><input type="number" id="ang" inputmode="numeric" placeholder="Tebakanmu"><button class="btn" onclick="angkaKirim('+k+','+lo+','+hi+')">Tebak</button>':'<p>Menunggu <b>'+esc(P[1-ME])+'</b> menebak…</p>')+'</div>');
}
function angkaKirim(k,lo,hi){
  var v=parseInt(el('ang').value,10);
  if(isNaN(v)||v<lo||v>hi){el('ang').focus();return}
  gW('g'+k,v);
}

/* Tebak Pilihan */
function rPilih(){
  if(!bothReady()){lobby();return}
  var P=CONFIG.pemain,Q=OG.c.q.split(',').map(function(i){return CONFIG.pilih[+i]}),r=OG.r||0,i,s=0;
  for(i=0;i<Math.min(r,Q.length);i++){var aa=gP(i%2)['a'+i];if(aa!==undefined&&aa===gP(1-i%2)['g'+i])s++}
  if(r>=Q.length){
    OG.over=true;
    var best=ls('bestK',0);if(s>best){best=s;sv('bestK',s)}
    var m=s>=8?'Kompak banget, kalian emang cocok! 💕':s>=5?'Lumayan kompak, masih banyak yang bisa dicari tahu 😆':'Masih banyak yang harus saling kenalan nih 😂';
    scr('pend',bk()+'<div class="card center"><h2>Skor kekompakan: '+s+' / '+Q.length+'</h2><p>'+m+'</p><p class="sub">Rekor terbaik: '+best+'</p><button class="btn" onclick="gAgain()">Main lagi</button></div>');
    return;
  }
  var c=r%2,t=1-c,q=Q[r],a=gP(c)['a'+r],g=gP(t)['g'+r],head='<p class="sub">Ronde '+(r+1)+' dari '+Q.length+' • Kompak: '+s+'</p>';
  function opts(fn){return q.map(function(x,k){return '<button class="opt" onclick="'+fn+'('+r+','+k+')">'+esc(x)+'</button>'}).join('')}
  if(a!==undefined&&g!==undefined){
    var ok=a===g;
    scr('p'+r+'r',bk()+head+'<div class="card center"><p>'+esc(P[c])+' memilih: <b>'+esc(q[a])+'</b></p><p>'+esc(P[t])+' menebak: <b>'+esc(q[g])+'</b></p><h2>'+(ok?'Cocok! 💕':'Belum cocok 😆')+'</h2><button class="btn" onclick="pilNext()">Lanjut</button></div>');
  }else if(ME===c){
    if(a===undefined)scr('p'+r+'a',bk()+head+'<div class="card center"><b>Giliran kamu memilih, '+esc(P[c])+'</b><p class="sub">'+esc(P[t])+' akan menebak 🙈</p></div>'+opts('pilA'));
    else scr('p'+r+'aw',bk()+head+'<div class="card center"><h2>Pilihan tersimpan ✅</h2><p class="sub">Menunggu '+esc(P[t])+' menebak…</p></div>');
  }else{
    if(a===undefined)scr('p'+r+'tw',bk()+head+'<div class="card center"><h2>Menunggu '+esc(P[c])+' memilih…</h2><p class="sub">Siap-siap menebak 🔮</p></div>');
    else scr('p'+r+'g',bk()+head+'<div class="card center"><b>'+esc(P[t])+', tebak pilihan '+esc(P[c])+'!</b></div>'+opts('pilG'));
  }
}
function pilA(r,k){if(OG&&OG.m==='pilih'&&gP(ME)['a'+r]===undefined)gW('a'+r,k)}
function pilG(r,k){if(OG&&OG.m==='pilih'&&gP(ME)['g'+r]===undefined)gW('g'+r,k)}
function pilNext(){OG.r=(OG.r||0)+1;OG.render()}

/* ---- pembungkus tampilan: lacak layar aktif & keluar dari game online ---- */
var DV={coreView:1,timelineView:1,misiView:1,skorView:1,papanView:1};
['home','gachaView','coreView','timelineView','suratView','gameView','duelMenu','misiView','rodaView','skorView','tdView','papanView','pesanView','connectView'].forEach(function(n){
  var f=window[n];
  window[n]=function(){
    gLeave();
    CURV=DV[n]?n:null;
    if(n==='gameView'||n==='duelMenu')CURM=n;
    return f.apply(this,arguments);
  };
});

connect();
home();
